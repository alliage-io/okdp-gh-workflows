{{- $old := lookup "v1" "Secret" .Release.Namespace "x" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  annotations:
    helm.sh/hook: pre-delete
    first-install: {{ .Release.IsInstall | quote }}
stringData:
  password: {{ randAlphaNum 16 | quote }}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
{{- end }}
