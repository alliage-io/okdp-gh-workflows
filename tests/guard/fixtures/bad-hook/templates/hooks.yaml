  annotations:
    "helm.sh/hook": pre-delete
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test
  annotations:
    helm.sh/hook: post-install,test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-t
  annotations:
    helm.sh/hook: {{ .Values.hook }}
