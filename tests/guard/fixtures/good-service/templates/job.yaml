{{- /*
  lookup and randAlphaNum are forbidden: this comment must not trip the guard.
  .Release.IsInstall too.
*/ -}}
{{- if semverCompare ">=1.25-0" .Capabilities.KubeVersion.GitVersion }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    lookup-free: "yes"   # plain text outside a template action is not code
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init
          image: busybox:1.36
          command: ["sh", "-c", "echo {{ .Values.replicas }}"]
{{- end }}
